[project]
name = "factorio-forge"
version = "0.0.1"
description = "LLM-driven quality-diversity optimization of Factorio production structures"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Géraud" }]
keywords = ["factorio", "quality-diversity", "map-elites", "evolutionary-search", "blueprint"]

dependencies = [
    "factorio-draftsman>=3.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["src/factorio_forge"]
